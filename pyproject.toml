[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netdevops-ai"
version = "0.1.0"
description = "LLM-powered NOC tools: config-diff explainer + syslog incident digester"
readme = "README.md"
authors = [{name = "Your Name", email = "you@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["network-automation", "ai", "llm", "syslog", "config-diff", "isp", "netdevops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
netdevops-ai-diff   = "netdevops_ai.config_diff:main"
netdevops-ai-digest = "netdevops_ai.syslog_digest:main"

[project.urls]
Homepage = "https://github.com/<you>/netdevops-ai"
Repository = "https://github.com/<you>/netdevops-ai"

[tool.hatch.build.targets.wheel]
packages = ["netdevops_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
